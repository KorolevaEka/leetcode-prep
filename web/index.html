<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Coding Trainings</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2de;
    --accent: #3b5bdb; --ok: #2b8a3e; --ok-bg: #ebfbee; --err: #c92a2a; --err-bg: #fff5f5;
    --code-bg: #f1f0ec; --kw: #7b2cbf; --str: #2b8a3e; --num: #c2410c; --cmt: #8a8a84; --def: #1c64b8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ecebe7; --muted: #9a9993; --line: #33332f;
      --accent: #748ffc; --ok: #69db7c; --ok-bg: #1b2b1f; --err: #ff8787; --err-bg: #2f1c1c;
      --code-bg: #2a2a27; --kw: #c4a7ff; --str: #8ce99a; --num: #ffa94d; --cmt: #77776f; --def: #74c0fc;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
  aside { border-right: 1px solid var(--line); overflow-y: auto; padding: 16px 12px; }
  aside h1 { font-size: 16px; margin: 0 8px 16px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--muted); margin: 16px 8px 6px; }
  aside button { display: flex; gap: 8px; width: 100%; text-align: left; border: 0; background: none;
                 color: inherit; font: inherit; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  aside button:hover { background: var(--code-bg); }
  aside button.active { background: var(--accent); color: #fff; }
  aside .mark { width: 1em; flex: none; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; }
  .readme { overflow-y: auto; padding: 24px 28px; border-right: 1px solid var(--line); }
  .readme h1 { font-size: 22px; margin-top: 0; }
  .readme a { color: var(--accent); }
  .readme code, .readme pre { background: var(--code-bg); border-radius: 4px;
                              font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .readme code { padding: 1px 4px; }
  .readme pre { padding: 10px 12px; overflow-x: auto; }
  .readme pre code { padding: 0; }
  .work { display: flex; flex-direction: column; min-height: 0; padding: 16px; gap: 12px; }
  .bar { display: flex; gap: 8px; align-items: center; }
  .bar .file { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 13px; margin-right: auto; }
  .bar button { font: inherit; padding: 6px 14px; border-radius: 6px; cursor: pointer;
                border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .bar button:disabled { opacity: .6; cursor: wait; }
  .editor { flex: 1 1 60%; min-height: 200px; position: relative; }
  .CodeMirror { position: absolute; inset: 0; height: auto; border-radius: 8px; border: 1px solid var(--line);
                background: var(--panel); color: var(--text); font: 14px/1.5 ui-monospace, Menlo, monospace; }
  .CodeMirror-focused { border-color: var(--accent); }
  .CodeMirror-gutters { background: var(--panel); border-right: 1px solid var(--line); }
  .CodeMirror-linenumber { color: var(--muted); }
  .CodeMirror-cursor { border-left-color: var(--text); }
  .CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: var(--code-bg); }
  .CodeMirror-matchingbracket { color: var(--accent) !important; font-weight: bold; }
  .cm-s-default .cm-keyword { color: var(--kw); }
  .cm-s-default .cm-builtin { color: var(--def); }
  .cm-s-default .cm-def { color: var(--def); }
  .cm-s-default .cm-string { color: var(--str); }
  .cm-s-default .cm-number { color: var(--num); }
  .cm-s-default .cm-comment { color: var(--cmt); }
  .cm-s-default .cm-variable, .cm-s-default .cm-variable-2, .cm-s-default .cm-property,
  .cm-s-default .cm-operator, .cm-s-default .cm-punctuation { color: var(--text); }
  pre.out { flex: 1 1 40%; margin: 0; overflow: auto; padding: 12px; border-radius: 8px;
            background: var(--panel); border: 1px solid var(--line); color: var(--muted);
            font: 13px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; }
  pre.out.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
  pre.out.err { background: var(--err-bg); color: var(--err); border-color: var(--err); }
  .empty { padding: 40px; color: var(--muted); }
  .hints { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
  .hints:empty { display: none; }
  .chip { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px;
          background: var(--panel); font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .chip button { border: 0; background: none; color: inherit; font: inherit; cursor: pointer; padding: 3px 4px 3px 10px; }
  .chip button.x { padding: 3px 9px 3px 4px; color: var(--muted); }
  .chip button.x:hover { color: var(--err); }
  .chip:hover { border-color: var(--accent); }
  .chip.used { opacity: .55; }
  .chip.used button:first-child::after { content: " ✓"; color: var(--ok); }
  .hints .reset { border: 0; background: none; color: var(--muted); font: inherit; cursor: pointer; text-decoration: underline; }
  .readme h2 { font-size: 16px; margin: 28px 0 10px; }
  .muted { color: var(--muted); font-size: 13px; }
  .er { position: relative; display: flex; flex-wrap: wrap; gap: 28px 36px; align-items: flex-start;
        padding: 4px 36px 4px 0; }
  .er svg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  .er path { fill: none; stroke: var(--accent); stroke-width: 1.5; }
  .er path.guess { stroke-dasharray: 5 4; stroke: var(--muted); }
  .er circle { fill: var(--accent); }
  .er circle.guess { fill: var(--muted); }
  .tbl { position: relative; z-index: 1; min-width: 170px; background: var(--panel);
         border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: 13px; }
  .tname { padding: 6px 10px; font-weight: 600; background: var(--code-bg); border-bottom: 1px solid var(--line); }
  .col { display: flex; gap: 8px; align-items: baseline; padding: 3px 10px;
         font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .col .typ { margin-left: auto; padding-left: 12px; color: var(--muted); }
  .key { flex: none; width: 36px; font-size: 10px; font-weight: 700; color: var(--muted); }
  .key.pk { color: var(--num); }
  .key.fk { color: var(--accent); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; }
  .legend svg { vertical-align: middle; margin-right: 4px; }
  .data { margin: 12px 0; }
  .data summary { cursor: pointer; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .data .scroll { overflow-x: auto; margin-top: 6px; }
  .data table { border-collapse: collapse; font: 12.5px/1.4 ui-monospace, Menlo, monospace; }
  .data th, .data td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; white-space: nowrap; }
  .data th { background: var(--code-bg); }
  .data td.null { color: var(--muted); font-style: italic; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    main { grid-template-columns: 1fr; }
    .readme { border-right: 0; padding: 16px; }
    .editor { min-height: 50vh; }
  }
</style>
</head>
<body>
<div class="app">
  <aside id="list"><h1>Live Coding Trainings</h1></aside>
  <main id="main"><div class="empty">Выбери задачу слева</div></main>
</div>
<script type="module">
import { check } from "./check.js";
import * as python from "./runners/python.js";
import * as sql from "./runners/sql.js";
import * as ts from "./runners/ts.js";
let tasks = [], current = null, editor = null, saveTimer = null;

const store = {
  get(k, d) { try { return JSON.parse(localStorage[k]) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage[k] = JSON.stringify(v); } catch {} },
};
const solved = store.get("solved", {});
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const md = s => window.marked ? marked.parse(s) : `<pre>${esc(s)}</pre>`;

// ---------- Исполнители ----------
let sqlLoading = null;
const PGLITE_URL = "https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.2.17/dist/index.js";
// лениво, один раз; при сбое сбрасываем, чтобы повторный запуск мог сработать
const sqlReady = () => sqlLoading ??= import(PGLITE_URL).then(m => sql.init(m.PGlite))
  .catch(e => { sqlLoading = null; throw e; });
const executors = {
  python: python.execute,
  ts: ts.execute,
  sql: async (...args) => { await sqlReady(); return sql.execute(...args); },
};

// ---------- Схема таблиц для SQL-задач ----------
async function loadSchema(t) {
  await sqlReady();
  const db = await sql.db();
  await db.exec(t.schema);
  const cols = (await db.query(`
    SELECT cl.relname AS tbl, a.attname AS col, format_type(a.atttypid, a.atttypmod) AS typ
    FROM pg_attribute a JOIN pg_class cl ON cl.oid = a.attrelid JOIN pg_namespace n ON n.oid = cl.relnamespace
    WHERE n.nspname = 't' AND cl.relkind = 'r' AND a.attnum > 0 AND NOT a.attisdropped
    ORDER BY cl.oid, a.attnum`)).rows;
  const keys = (await db.query(`
    SELECT con.contype AS kind, cl.relname AS tbl, a.attname AS col, fcl.relname AS ftbl, fa.attname AS fcol
    FROM pg_constraint con
    JOIN pg_class cl ON cl.oid = con.conrelid
    JOIN pg_namespace n ON n.oid = cl.relnamespace AND n.nspname = 't'
    CROSS JOIN LATERAL unnest(con.conkey) WITH ORDINALITY AS k(attnum, i)
    JOIN pg_attribute a ON a.attrelid = con.conrelid AND a.attnum = k.attnum
    LEFT JOIN pg_class fcl ON fcl.oid = con.confrelid
    LEFT JOIN pg_attribute fa ON fa.attrelid = con.confrelid AND fa.attnum = con.confkey[k.i]
    WHERE con.contype IN ('p', 'f')`)).rows;

  const tables = {};
  for (const c of cols) (tables[c.tbl] ??= { name: c.tbl, cols: [] }).cols.push({ name: c.col, type: c.typ });
  const pk = new Set(keys.filter(k => k.kind === "p").map(k => `${k.tbl}.${k.col}`));
  const links = keys.filter(k => k.kind === "f")
    .map(k => ({ from: `${k.tbl}.${k.col}`, to: `${k.ftbl}.${k.fcol}`, real: true }));

  // В учебных схемах внешних ключей обычно не объявляют (и данные им не всегда соответствуют),
  // поэтому дорисовываем пунктиром связи по имени: person_id -> person / persons / people.
  // ponytail: эвристика по именам, для нестандартных имён объявляй REFERENCES в schema.sql
  const linked = new Set(links.map(l => l.from));
  for (const tb of Object.values(tables)) {
    for (const c of tb.cols) {
      const from = `${tb.name}.${c.name}`, m = c.name.match(/^(.+)_id$/);
      if (!m || linked.has(from)) continue;
      const base = m[1];
      const target = Object.values(tables).find(o => o.name !== tb.name &&
        [base, base + "s", base + "es", base.replace(/y$/, "ies"), base === "person" ? "people" : ""].includes(o.name));
      if (!target) continue;
      if (pk.has(from) && tb.cols.filter(x => pk.has(`${tb.name}.${x.name}`)).length === 1) continue; // свой PK
      const tcol = target.cols.find(x => pk.has(`${target.name}.${x.name}`))
        ?? target.cols.find(x => x.name === c.name || x.name === "id");
      if (tcol) links.push({ from, to: `${target.name}.${tcol.name}`, real: false });
    }
  }

  const data = {};
  for (const name of Object.keys(tables)) {
    const r = await db.query(`SELECT * FROM t."${name.replace(/"/g, '""')}" LIMIT 50`, [], { rowMode: "array" });
    data[name] = { fields: r.fields.map(f => f.name), rows: r.rows };
  }
  return { tables: Object.values(tables), pk, links, data };
}

function renderSchema(el, { tables, pk, links, data }) {
  const fks = new Set(links.map(l => l.from));
  const card = tb => `<div class="tbl"><div class="tname">${esc(tb.name)}</div>${tb.cols.map(c => {
    const id = `${tb.name}.${c.name}`, isPk = pk.has(id), isFk = fks.has(id);
    const key = isPk && isFk ? '<span class="key pk">PK·FK</span>' : isPk ? '<span class="key pk">PK</span>'
      : isFk ? '<span class="key fk">FK</span>' : '<span class="key"></span>';
    return `<div class="col" data-c="${esc(id)}">${key}<span>${esc(c.name)}</span><span class="typ">${esc(c.type)}</span></div>`;
  }).join("")}</div>`;
  const dataTable = name => {
    const d = data[name];
    return `<details class="data" open><summary>${esc(name)} <span class="muted">(${d.rows.length} строк)</span></summary>
      <div class="scroll"><table><tr>${d.fields.map(f => `<th>${esc(f)}</th>`).join("")}</tr>${d.rows.map(r =>
        `<tr>${r.map(v => v === null ? '<td class="null">NULL</td>' : `<td>${esc(String(v))}</td>`).join("")}</tr>`).join("")}</table></div></details>`;
  };
  el.innerHTML = `
    <h2>Схема</h2>
    <div class="er"><svg></svg>${tables.map(card).join("")}</div>
    <div class="legend muted">
      <span><svg width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" style="stroke:var(--accent);stroke-width:1.5"/></svg>внешний ключ</span>
      <span><svg width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" style="stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4"/></svg>связь по имени колонки (не объявлена)</span>
      <span>● — сторона первичного ключа</span>
    </div>
    <h2>Данные</h2>${tables.map(tb => dataTable(tb.name)).join("")}`;
  const er = el.querySelector(".er");
  const draw = () => {
    const box = er.getBoundingClientRect(), svg = er.querySelector("svg");
    svg.setAttribute("width", box.width); svg.setAttribute("height", box.height);
    svg.innerHTML = links.map(l => {
      const a = er.querySelector(`[data-c="${CSS.escape(l.from)}"]`)?.getBoundingClientRect();
      const b = er.querySelector(`[data-c="${CSS.escape(l.to)}"]`)?.getBoundingClientRect();
      if (!a || !b) return "";
      const ay = a.top + a.height / 2 - box.top, by = b.top + b.height / 2 - box.top;
      const acx = a.left + a.width / 2, bcx = b.left + b.width / 2;
      let ax, bx, c1, c2;
      if (Math.abs(acx - bcx) < 60) {          // карточки друг под другом (или ссылка на себя): дуга справа
        ax = a.right - box.left; bx = b.right - box.left;
        const d = 36; c1 = ax + d; c2 = bx + d;
      } else if (bcx > acx) {                 // цель правее
        ax = a.right - box.left; bx = b.left - box.left;
        const d = Math.max(30, (bx - ax) / 2); c1 = ax + d; c2 = bx - d;
      } else {                                // цель левее
        ax = a.left - box.left; bx = b.right - box.left;
        const d = Math.max(30, (ax - bx) / 2); c1 = ax - d; c2 = bx + d;
      }
      const cls = l.real ? "" : "guess";
      return `<path class="${cls}" d="M${ax},${ay} C${c1},${ay} ${c2},${by} ${bx},${by}"/>
              <circle class="${cls}" cx="${bx}" cy="${by}" r="3.5"/>`;
    }).join("");
  };
  draw();
  new ResizeObserver(draw).observe(er);
}

// ---------- UI ----------
function renderList() {
  const list = document.getElementById("list");
  list.innerHTML = "<h1>Live Coding Trainings</h1>";
  for (const kind of ["python", "sql", "ts"]) {
    const group = tasks.filter(t => t.lang === kind);
    if (!group.length) continue;
    list.insertAdjacentHTML("beforeend", `<h2>${{ python: "Python", sql: "SQL", ts: "TypeScript" }[kind]}</h2>`);
    for (const t of group) {
      const b = document.createElement("button");
      b.className = t.id === current?.id ? "active" : "";
      b.innerHTML = `<span class="mark">${solved[t.id] ? "✓" : ""}</span><span>${esc(t.id.split("/")[2])}</span>`;
      b.onclick = () => { location.hash = t.id; };
      list.append(b);
    }
  }
}

function save() {
  const code = editor.getValue();
  store.set("draft:" + current.id, code);
}

// Подсказки: ключевые слова из task.json. Ничего не проверяют и не обязательны —
// клик вставляет слово в редактор, × убирает подсказку, уже использованные помечены ✓.
function renderHints() {
  const el = document.getElementById("hints"), t = current;
  const key = "hints-hidden:" + t.id, hidden = store.get(key, []);
  const shown = t.hints.filter(h => !hidden.includes(h));
  const code = editor.getValue();
  const used = h => new RegExp(`\\b${h.replace(/\s+/g, "\\s+")}\\b`, "i").test(code);
  el.innerHTML = (shown.length ? '<span class="muted">Подсказка:</span>' : "") +
    shown.map(h => `<span class="chip ${used(h) ? "used" : ""}"><button data-h="${esc(h)}" title="Вставить в редактор">${esc(h)}</button><button class="x" data-x="${esc(h)}" title="Убрать подсказку">×</button></span>`).join("") +
    (hidden.length && t.hints.length ? `<button class="reset">вернуть подсказки (${hidden.length})</button>` : "");
  el.onclick = e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.h) {
      const { line, ch } = editor.getCursor(), before = editor.getLine(line).slice(0, ch);
      editor.replaceSelection((before && !/\s$/.test(before) ? " " : "") + b.dataset.h + " ");
      editor.focus();
    } else if (b.dataset.x) {
      store.set(key, [...hidden, b.dataset.x]); renderHints();
    } else {
      store.set(key, []); renderHints();
    }
  };
}

function open(id) {
  current = tasks.find(t => t.id === id);
  renderList();
  const main = document.getElementById("main");
  if (!current) { main.innerHTML = '<div class="empty">Выбери задачу слева</div>'; return; }
  const py = current.lang === "python", isTs = current.lang === "ts";
  main.innerHTML = `
    <section class="readme">${md(current.readme)}<div id="schema"></div></section>
    <section class="work">
      <div class="bar">
        <span class="file">${esc(current.id)}/${py ? "solution.py" : isTs ? "solution.ts" : "solution.sql"}</span>
        <button id="run">Запустить ⌘↵</button>
      </div>
      <div class="hints" id="hints"></div>
      <div class="editor" id="editor"></div>
      <pre class="out" id="out">Вывод тестов появится здесь</pre>
    </section>`;
  const code = store.get("draft:" + current.id, current.starter);
  const mod = /Mac/.test(navigator.platform) ? "Cmd" : "Ctrl";
  editor = CodeMirror(document.getElementById("editor"), {
    value: code,
    mode: py ? "python" : isTs ? "text/typescript" : "text/x-pgsql",
    lineNumbers: true, indentUnit: isTs ? 2 : 4, tabSize: isTs ? 2 : 4, indentWithTabs: false,
    matchBrackets: true, autoCloseBrackets: true,
    extraKeys: {
      Tab: cm => cm.somethingSelected() ? cm.indentSelection("add") : cm.replaceSelection(" ".repeat(cm.getOption("indentUnit"))),
      "Shift-Tab": cm => cm.indentSelection("subtract"),
      [`${mod}-Enter`]: run,
      [`${mod}-S`]: save,
    },
  });
  editor.on("change", () => { clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); renderHints(); });
  renderHints();
  editor.focus();
  document.getElementById("run").onclick = run;
  if (py) { python.warmup(); return; } // начинаем грузить Python заранее
  if (isTs) { ts.warmup(); return; }
  const t = current, el = document.getElementById("schema");
  el.innerHTML = '<h2>Схема</h2><p class="muted">Загружаю Postgres в браузер…</p>';
  loadSchema(t).then(s => t === current && renderSchema(el, s))
    .catch(e => { if (t === current) el.innerHTML = `<h2>Схема</h2><pre>${esc(String(e.message || e))}</pre>`; });
}

async function run() {
  const btn = document.getElementById("run"), out = document.getElementById("out");
  const t = current, code = editor.getValue();
  save();
  btn.disabled = true; out.className = "out";
  out.textContent = t.lang === "python" && !python.isReady() ? "Загружаю Python в браузер (первый раз ~10 сек)…"
    : t.lang === "ts" && !ts.isReady() ? "Загружаю TypeScript в браузер (первый раз ~10 сек)…" : "Запускаю…";
  let r;
  try { r = await check(t, code, executors[t.lang]); }
  catch (e) { r = { ok: false, output: "Не удалось выполнить: " + String(e.message || e) }; }
  if (t !== current) { btn.disabled = false; return; }
  btn.disabled = false;
  out.className = "out " + (r.ok ? "ok" : "err");
  out.textContent = r.output;
  if (r.ok) { solved[t.id] = true; store.set("solved", solved); renderList(); }
}

window.onhashchange = () => open(decodeURIComponent(location.hash.slice(1)));
tasks = await (await fetch("tasks.json", { cache: "no-store" })).json();
window.onhashchange();
</script>
