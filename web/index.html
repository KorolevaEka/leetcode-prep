<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Coding Trainings</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside id="list"><h1>Live Coding Trainings</h1></aside>
  <main id="main"><div class="empty">Выбери задачу слева</div></main>
</div>
<script type="module">
import { check } from "./check.js";
import * as python from "./runners/python.js";
import * as sql from "./runners/sql.js";
import * as ts from "./runners/ts.js";
import * as java from "./runners/java.js";
import { createEditor, renderHints } from "./editor.js";
import { loadSchema, renderSchema } from "./schema.js";
let tasks = [], current = null, editor = null, saveTimer = null;

const store = {
  get(k, d) { try { return JSON.parse(localStorage[k]) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage[k] = JSON.stringify(v); } catch {} },
};
const solved = store.get("solved", {});
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const md = s => window.marked ? marked.parse(s) : `<pre>${esc(s)}</pre>`;

// ---------- Исполнители ----------
let sqlLoading = null;
const PGLITE_URL = "https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.2.17/dist/index.js";
// лениво, один раз; при сбое сбрасываем, чтобы повторный запуск мог сработать
const sqlReady = () => sqlLoading ??= import(PGLITE_URL).then(m => sql.init(m.PGlite))
  .catch(e => { sqlLoading = null; throw e; });
const executors = {
  python: python.execute,
  ts: ts.execute,
  java: java.execute,
  sql: async (...args) => { await sqlReady(); return sql.execute(...args); },
};

// ---------- UI ----------
function renderList() {
  const list = document.getElementById("list");
  list.innerHTML = "<h1>Live Coding Trainings</h1>";
  for (const kind of ["python", "sql", "ts", "java"]) {
    const group = tasks.filter(t => t.lang === kind);
    if (!group.length) continue;
    list.insertAdjacentHTML("beforeend", `<h2>${{ python: "Python", sql: "SQL", ts: "TypeScript", java: "Java" }[kind]}</h2>`);
    for (const t of group) {
      const b = document.createElement("button");
      b.className = t.id === current?.id ? "active" : "";
      b.innerHTML = `<span class="mark">${solved[t.id] ? "✓" : ""}</span><span>${esc(t.id.split("/")[2])}</span>`;
      b.onclick = () => { location.hash = t.id; };
      list.append(b);
    }
  }
}

function save() {
  const code = editor.getValue();
  store.set("draft:" + current.id, code);
}

const hints = () => renderHints(document.getElementById("hints"), editor, current);

function open(id) {
  current = tasks.find(t => t.id === id);
  renderList();
  const main = document.getElementById("main");
  if (!current) { main.innerHTML = '<div class="empty">Выбери задачу слева</div>'; return; }
  const py = current.lang === "python", isTs = current.lang === "ts", isJava = current.lang === "java";
  main.innerHTML = `
    <section class="readme">${md(current.readme)}<div id="schema"></div></section>
    <section class="work">
      <div class="bar">
        <span class="file">${esc(current.id)}/${py ? "solution.py" : isTs ? "solution.ts" : isJava ? "Solution.java" : "solution.sql"}</span>
        <button id="run">Запустить ⌘↵</button>
      </div>
      <div class="hints" id="hints"></div>
      <div class="editor" id="editor"></div>
      <pre class="out" id="out">Вывод тестов появится здесь</pre>
    </section>`;
  const code = store.get("draft:" + current.id, current.starter);
  editor = createEditor(document.getElementById("editor"), { value: code, lang: current.lang, onRun: run, onSave: save });
  editor.on("change", () => { clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); hints(); });
  hints();
  editor.focus();
  document.getElementById("run").onclick = run;
  if (py) { python.warmup(); return; } // начинаем грузить Python заранее
  if (isTs) { ts.warmup(); return; }
  if (isJava) { java.warmup(); return; }
  const t = current, el = document.getElementById("schema");
  el.innerHTML = '<h2>Схема</h2><p class="muted">Загружаю Postgres в браузер…</p>';
  sqlReady().then(() => sql.db()).then(db => loadSchema(t, db)).then(s => t === current && renderSchema(el, s))
    .catch(e => { if (t === current) el.innerHTML = `<h2>Схема</h2><pre>${esc(String(e.message || e))}</pre>`; });
}

async function run() {
  const btn = document.getElementById("run"), out = document.getElementById("out");
  const t = current, code = editor.getValue();
  save();
  btn.disabled = true; out.className = "out";
  out.textContent = t.lang === "python" && !python.isReady() ? "Загружаю Python в браузер (первый раз ~10 сек)…"
    : t.lang === "ts" && !ts.isReady() ? "Загружаю TypeScript в браузер (первый раз ~10 сек)…"
    : t.lang === "java" && !java.isReady() ? "Загружаю Java в браузер (первый раз до минуты)…" : "Запускаю…";
  let r;
  try { r = await check(t, code, executors[t.lang]); }
  catch (e) { r = { ok: false, output: "Не удалось выполнить: " + String(e.message || e) }; }
  if (t !== current) { btn.disabled = false; return; }
  btn.disabled = false;
  out.className = "out " + (r.ok ? "ok" : "err");
  out.textContent = r.output;
  if (r.ok) { solved[t.id] = true; store.set("solved", solved); renderList(); }
}

window.onhashchange = () => open(decodeURIComponent(location.hash.slice(1)));
tasks = await (await fetch("tasks.json", { cache: "no-store" })).json();
window.onhashchange();
</script>
</body>
</html>
